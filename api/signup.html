<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LifeFlow sign up</title></head>
<body style="font-family:Arial;max-width:400px;margin:20px auto;padding:0 12px">
<h3>LifeFlow - Create account</h3>
<p>Name<br><input id="n" style="width:100%"></p>
<p>Email<br><input id="e" style="width:100%"></p>
<p>Blood type<br><select id="b" style="width:100%"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></p>
<p>City<br><input id="c" style="width:100%"></p>
<p>Password<br><input id="p" type="password" style="width:100%"></p>
<button type="button" id="go" style="width:100%;padding:12px">Create account</button>
<p id="m"></p>
<script>
document.getElementById("go").onclick = function () {
  var m = document.getElementById("m");
  m.textContent = "Please wait...";
  fetch("/api/register.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role: "donor", name: n.value, email: e.value, bloodType: b.value, city: c.value, password: p.value })
  })
  .then(function (r) { return r.json(); })
  .then(function (d) { m.textContent = d.message || d.error; })
  .catch(function (x) { m.textContent = "Error: " + x.message; });
};
</script>
</body></html>
